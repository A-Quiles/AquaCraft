name: Android

# Cada push a main: tests + APK de prueba (descargable en "Artifacts").
# Si existen los secretos de la clave de subida, además genera el AAB firmado para Google Play.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Caché de Godot y plantillas
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Descargar Godot y plantillas de exportación
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          wget -q $base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          wget -q $base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Importar recursos
        run: ./godot --headless --import || true

      - name: Tests
        run: |
          ./godot --headless -s tests/test_core.gd
          ./godot --headless --resolution 720x1280 -s tests/smoke.gd -- demo=1 2>&1 | tee smoke.log
          ! grep -q "SCRIPT ERROR" smoke.log

      - name: Versión (código = nº de ejecución)
        run: |
          sed -i "s/^version\/code=.*/version\/code=${{ github.run_number }}/" export_presets.cfg
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            sed -i "s/^version\/name=.*/version\/name=\"${GITHUB_REF_NAME#v}\"/" export_presets.cfg
          fi

      - name: APK de prueba
        run: |
          keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p build
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$PWD/debug.keystore \
          GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey \
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android \
          ./godot --headless --export-debug "Android APK" build/AquaCraft-debug.apk
          ls -lh build

      - uses: actions/upload-artifact@v4
        with:
          name: AquaCraft-apk
          path: build/AquaCraft-debug.apk

      - name: AAB firmado para Google Play
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$RUNNER_TEMP/upload.keystore"
          ./godot --headless --install-android-build-template --export-release "Google Play AAB" build/AquaCraft.aab
          rm "$RUNNER_TEMP/upload.keystore"
          ls -lh build

      - uses: actions/upload-artifact@v4
        if: env.HAS_KEYSTORE == 'true'
        with:
          name: AquaCraft-aab
          path: build/AquaCraft.aab
