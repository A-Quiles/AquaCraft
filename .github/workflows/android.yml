name: Android

# Cada push a main: tests + APK de prueba (descargable en "Artifacts").
# Si existen los secretos de la clave de subida, además genera el AAB firmado para Google Play.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Caché de Godot y plantillas
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Descargar Godot y plantillas de exportación
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          wget -q $base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          wget -q $base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Importar recursos
        run: ./godot --headless --import || true

      - name: Tests
        run: |
          ./godot --headless -s tests/test_core.gd
          ./godot --headless --resolution 720x1280 -s tests/smoke.gd -- demo=1 2>&1 | tee smoke.log
          ! grep -q "SCRIPT ERROR" smoke.log

      - name: Versión (código = nº de ejecución)
        run: |
          sed -i "s/^version\/code=.*/version\/code=${{ github.run_number }}/" export_presets.cfg
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            sed -i "s/^version\/name=.*/version\/name=\"${GITHUB_REF_NAME#v}\"/" export_presets.cfg
          fi

      # Notificaciones locales: plugin Android propio (plugins_src/aqua_notify). Se compila contra las clases
      # de la plantilla de Godot y con su mismo Gradle/AGP. Si algo falla, el APK sale igual (sin avisos).
      - name: Plugin de notificaciones (AAR)
        continue-on-error: true
        run: |
          set -e
          TPL=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_source.zip
          rm -rf /tmp/tpl && mkdir -p /tmp/tpl && unzip -q "$TPL" -d /tmp/tpl
          AGP=$(grep -rhoP "androidGradlePlugin\s*[:=]\s*['\"]\K[0-9.]+" /tmp/tpl | head -1 || true)
          AGP=${AGP:-8.6.1}
          LIB=$(find /tmp/tpl -name "godot-lib.template_release.aar" | head -1)
          WRAP=$(dirname "$(find /tmp/tpl -name gradlew | head -1)")
          P=plugins_src/aqua_notify
          mkdir -p $P/libs
          unzip -p "$LIB" classes.jar > $P/libs/godot-classes.jar
          cp -r "$WRAP/gradlew" "$WRAP/gradle" $P/
          sed -i "s/AGP_VERSION/$AGP/" $P/settings.gradle
          (cd $P && chmod +x gradlew && ./gradlew --no-daemon -q assembleRelease)
          cp $P/build/outputs/aar/*-release.aar addons/aqua_notify/bin/aqua_notify-release.aar
          echo "::notice::Plugin de notificaciones compilado (AGP $AGP)"

      - name: APK de prueba
        run: |
          keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p build
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$PWD/debug.keystore
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android
          if [ -f addons/aqua_notify/bin/aqua_notify-release.aar ]; then
            ./godot --headless --install-android-build-template --export-debug "Android APK Gradle" build/AquaCraft-debug.apk 2>&1 | tee export.log || true
            if [ -f build/AquaCraft-debug.apk ]; then
              echo "::notice::APK con notificaciones (Gradle)"
            else
              echo "::warning::La exportación Gradle falló: se genera el APK sin notificaciones"
              grep -iE "error|failed|what went wrong" export.log | tail -8 | sed 's/^/::warning::/'
            fi
          fi
          if [ ! -f build/AquaCraft-debug.apk ]; then
            ./godot --headless --export-debug "Android APK" build/AquaCraft-debug.apk 2>&1 | tee export.log
          fi
          if [ ! -f build/AquaCraft-debug.apk ]; then
            grep -iE "error|invalid|missing|not found" export.log | tail -15 | sed 's/^/::error::/'
            exit 1
          fi
          ls -lh build

      - uses: actions/upload-artifact@v4
        with:
          name: AquaCraft-apk
          path: build/AquaCraft-debug.apk

      - name: AAB firmado para Google Play
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$RUNNER_TEMP/upload.keystore"
          ./godot --headless --install-android-build-template --export-release "Google Play AAB" build/AquaCraft.aab 2>&1 | tee export-aab.log
          rm "$RUNNER_TEMP/upload.keystore"
          if [ ! -f build/AquaCraft.aab ]; then
            grep -iE "error|failed|invalid|missing" export-aab.log | tail -15 | sed 's/^/::error::/'
            exit 1
          fi
          ls -lh build

      - uses: actions/upload-artifact@v4
        if: env.HAS_KEYSTORE == 'true'
        with:
          name: AquaCraft-aab
          path: build/AquaCraft.aab
